name: Lint Charts

on:
  pull_request:
    paths:
      - 'charts/**'
      - 'scripts/**'
      - '.github/workflows/lint.yaml'
  push:
    branches:
      - main
    paths:
      - 'charts/**'
      - 'scripts/**'
      - '.github/workflows/lint.yaml'

jobs:
  agnosticism:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Chart agnosticism lint
        run: scripts/check-charts-agnostic.sh
