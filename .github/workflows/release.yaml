name: Release Charts

on:
  push:
    branches:
      - main
    paths:
      - 'charts/**'
      - '.github/workflows/release.yaml'

jobs:
  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@github.com


      - name: Install Helm
        uses: azure/setup-helm@v5

      - name: Add dependent chart repositories
        run: |
          for dir in charts/*/; do
            helm dependency list --max-col-width 200 "$dir" 2>/dev/null | tail +2 | grep . | while read -r name version repo _; do
              case "$repo" in oci://*) continue ;; esac
              id=$(echo "$repo" | sed -E 's|^https?://||; s|/$||; s|[^A-Za-z0-9]|-|g')
              helm repo add "$id" "$repo" 2>/dev/null || true
            done
          done

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
