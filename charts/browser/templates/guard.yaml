{{- $main := get (.Values.controllers | default dict) "main" | default dict }}
{{- $replicas := get $main "replicas" | default 1 | int }}
{{- if gt $replicas 1 }}
{{- fail (printf "browser supports exactly 1 replica (got %d): the chromium profile on the RWO config volume is single-writer and concurrent browsers corrupt it. Refusing to render." $replicas) }}
{{- end }}
