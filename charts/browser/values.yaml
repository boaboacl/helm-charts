controllers:
  main:
    type: deployment
    # RWO profile volume: a second pod during a rolling update would fail to
    # attach (and two chromiums on one profile corrupt it).
    strategy: Recreate
    replicas: 1
    containers:
      main:
        image:
          repository: lscr.io/linuxserver/chromium
          # Moving tag: linuxserver rebuilds continuously (browser from distro
          # packages). Always + a periodic rollout restart keeps the running
          # build fresh without chart bumps; pin a digest here to freeze.
          tag: latest
          pullPolicy: Always
        env:
          # Passed verbatim to the chromium binary by the image init. The
          # dedicated --user-data-dir is load-bearing: Chrome 136+ silently
          # ignores --remote-debugging-port on the default profile directory.
          # --remote-debugging-address: the address itself is ignored (this
          # build always binds DevTools to 127.0.0.1 - hence the cdp-proxy
          # sidecar). Keep the flag: it mirrors the first-known-good config;
          # a 0.2.0 removal attempt coincided with an unrelated failure (see
          # configMaps.chromium-init for the real cause) and reverting the
          # flag is not worth another experiment.
          CHROME_CLI: >-
            --remote-debugging-port=9222
            --remote-debugging-address=0.0.0.0
            --user-data-dir=/config/chrome-profile
            --no-first-run
            --no-default-browser-check
          PUID: "1000"
          PGID: "1000"
        probes:
          liveness:
            enabled: true
            type: tcp
            port: 3000
          readiness:
            enabled: true
            type: tcp
            port: 3000
          startup:
            enabled: true
            type: tcp
            port: 3000
            spec:
              initialDelaySeconds: 20
              periodSeconds: 10
              failureThreshold: 30
        resources:
          requests:
            cpu: 250m
            memory: 1Gi
          limits:
            cpu: "1"
            memory: 3Gi
        securityContext:
          readOnlyRootFilesystem: false
      # L7 front for the CDP endpoint. Desktop chromium ignores
      # --remote-debugging-address and binds DevTools to 127.0.0.1 only, and
      # it additionally rejects HTTP Host headers that are not an IP or
      # localhost - so a plain TCP forward is not enough. nginx rewrites the
      # Host header, proxies WebSocket upgrades and fixes the
      # webSocketDebuggerUrl that chromium reports in /json/* responses
      # (clients such as playwright connect to that URL verbatim).
      # Config: configMaps.cdp-proxy, mounted via persistence.cdp-proxy-config.
      cdp-proxy:
        image:
          repository: docker.io/library/nginx
          # Moving tag (nginx stable branch); stable gets security fixes.
          tag: stable-alpine
          pullPolicy: IfNotPresent
        probes:
          readiness:
            enabled: true
            type: tcp
            port: 9223
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 128Mi

# The image boots as root so s6-overlay can fix /config ownership, then drops
# every supervised process to PUID/PGID (env above).
defaultPodOptions:
  securityContext:
    runAsUser: 0
    runAsGroup: 0

persistence:
  # Chromium profile (cookies, sessions, extensions) - the whole point: logins
  # done through the web UI outlive pod restarts. Scoped to the main
  # container only (advancedMounts): the cdp-proxy sidecar has no business
  # with the profile.
  config:
    enabled: true
    retain: true
    accessMode: ReadWriteOnce
    size: 4Gi
    advancedMounts:
      main:
        main:
          - path: /config
  # The image docs require ~1gb of shm for modern sites.
  shm:
    type: emptyDir
    medium: Memory
    sizeLimit: 1Gi
    advancedMounts:
      main:
        main:
          - path: /dev/shm
  # nginx config for the cdp-proxy sidecar, mounted at
  # /etc/nginx/conf.d/default.conf (replacing the image default).
  cdp-proxy-config:
    type: configMap
    identifier: cdp-proxy
    advancedMounts:
      main:
        cdp-proxy:
          - path: /etc/nginx/conf.d/default.conf
            subPath: default.conf
  # Singleton cleanup script for the chromium profile (see
  # configMaps.chromium-init), mounted into the main container's
  # linuxserver custom init dir. defaultMode 493 = 0755: the hook runner
  # skips non-executable files.
  chromium-init:
    type: configMap
    identifier: chromium-init
    defaultMode: 493
    advancedMounts:
      main:
        main:
          - path: /custom-cont-init.d/99-clean-singleton.sh
            subPath: 99-clean-singleton.sh

# nginx config for the cdp-proxy sidecar (see
# controllers.main.containers.cdp-proxy).
configMaps:
  cdp-proxy:
    enabled: true
    data:
      default.conf: |
        map $http_upgrade $connection_upgrade {
            default upgrade;
            ''      close;
        }

        server {
            listen 9223;

            location / {
                proxy_pass http://127.0.0.1:9222;
                proxy_http_version 1.1;
                # Chromium rejects non-IP/localhost Host headers. The :9222
                # suffix is load-bearing: chrome echoes the Host header
                # VERBATIM into webSocketDebuggerUrl, so a portless Host
                # yields ws://127.0.0.1/devtools/... which the sub_filter
                # patterns below do not match.
                proxy_set_header Host 127.0.0.1:9222;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection $connection_upgrade;
                # CDP sessions are long-lived and can sit idle for minutes.
                proxy_read_timeout 1h;
                proxy_send_timeout 1h;

                sub_filter_types application/json;
                sub_filter_once off;
                sub_filter 'ws://127.0.0.1:9222' 'ws://$http_host';
                sub_filter 'ws://localhost:9222' 'ws://$http_host';
            }
        }
  # Runs at container init (linuxserver custom-cont-init.d hook) as root,
  # before the desktop session launches chromium.
  chromium-init:
    enabled: true
    data:
      99-clean-singleton.sh: |
        #!/usr/bin/env bash
        # Stale chromium Singleton* files from an unclean pod shutdown make
        # the next chrome boot start WITHOUT the DevTools listener (verified
        # live: lock present = nothing on 9222, lock absent = listener up).
        # The image only cleans locks in the default profile dir, not in our
        # --user-data-dir. The profile is single-writer (replicas: 1,
        # Recreate strategy), so any lock present at boot is stale by
        # definition - safe to remove unconditionally.
        rm -f /config/chrome-profile/Singleton* 2>/dev/null || true

service:
  # Selkies web UI (the browser streamed to a human's browser). Expose through
  # an ingress with authentication - the image ships a web terminal with
  # passwordless sudo, so this port must never be reachable unauthenticated.
  main:
    controller: main
    ports:
      http:
        enabled: true
        port: 3000
        protocol: HTTP
        primary: true
  # Chrome DevTools Protocol endpoint for automation (agent browser tools,
  # playwright connect_over_cdp). Cluster-internal by design: never attach an
  # ingress to this service - CDP has no authentication. The port targets the
  # cdp-proxy sidecar (9223): desktop chromium only listens on 127.0.0.1.
  cdp:
    controller: main
    ports:
      cdp:
        enabled: true
        port: 9222
        targetPort: 9223
        protocol: HTTP
        primary: true

ingress:
  # Web UI ingress. Disabled by default - enable with a real host and put an
  # authenticating middleware in front (see README).
  main:
    enabled: false
    className: ""
    hosts:
      - host: browser.chart.example
        paths:
          - path: /
            pathType: Prefix
            service:
              identifier: main
              port: 3000
