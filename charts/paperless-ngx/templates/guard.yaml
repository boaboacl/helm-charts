{{- $main := get (.Values.controllers | default dict) "main" | default dict }}
{{- $replicas := get $main "replicas" | default 1 | int }}
{{- if gt $replicas 1 }}
{{- fail (printf "paperless-ngx supports exactly 1 replica (got %d): all state lives on single RWO volumes (media/data/export) and the bundled Redis is a single instance. Refusing to render." $replicas) }}
{{- end }}
