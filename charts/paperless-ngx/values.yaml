controllers:
  main:
    type: deployment
    # RWO volumes (media/data/export) forbid a rolling two-pod overlap.
    strategy: Recreate
    replicas: 1
    containers:
      main:
        image:
          repository: ghcr.io/paperless-ngx/paperless-ngx
          tag: 2.20.15
          pullPolicy: IfNotPresent
        # Empty map keeps the PAPERLESS_REDIS derivation in templates/common.yaml
        # working; all entries below are consumer-supplied examples.
        env: {}
          # Site-agnostic defaults: SQLite backend (upstream default with
          # PAPERLESS_DBENGINE unset) + the bundled redis. All
          # deployment-specific config (TZ, PAPERLESS_URL, database wiring,
          # OCR languages, auth stack) is consumer-supplied — see
          # docs/CHART_CONVENTIONS.md and the README consumer-values section.
          # PAPERLESS_DBENGINE: postgres
          # PAPERLESS_DBHOST: my-postgres-host
          # PAPERLESS_DBNAME: paperless
          # PAPERLESS_DBUSER:
          #   valueFrom:
          #     secretKeyRef:
          #       name: my-paperless-db-conn
          #       key: username
          # PAPERLESS_DBPASS:
          #   valueFrom:
          #     secretKeyRef:
          #       name: my-paperless-db-conn
          #       key: password
          # PAPERLESS_REDIS is derived in templates/common.yaml from the chart
          # fullname (redis://<fullname>-redis:6379) so it stays correct for
          # any release name.
        probes:
          # First boot runs migrations on empty volumes, so allow a generous
          # startup window before liveness/readiness kick in.
          startup:
            enabled: true
            type: HTTP
            path: /
            port: 8000
            spec:
              initialDelaySeconds: 10
              periodSeconds: 10
              failureThreshold: 30
          readiness:
            enabled: true
            type: HTTP
            path: /
            port: 8000
            spec:
              periodSeconds: 10
          liveness:
            enabled: true
            type: HTTP
            path: /
            port: 8000
            spec:
              periodSeconds: 30
  redis:
    type: deployment
    replicas: 1
    containers:
      redis:
        image:
          repository: redis
          tag: 7-alpine
          pullPolicy: IfNotPresent

# Names of existing Secrets injected wholesale as env vars via envFrom
# (Django SECRET_KEY, admin bootstrap credentials, OIDC socialaccount
# provider settings). Disabled by default — the chart never assumes
# site-specific Secret names; create Secrets out-of-band (e.g. SealedSecrets)
# and list their names here. Set to [] to disable env injection entirely.
secret:
  existingSecrets: []

service:
  # Paperless-ngx web UI / API
  main:
    controller: main
    ports:
      http:
        enabled: true
        port: 8000
        protocol: TCP
        primary: true
  # Task queue broker consumed by paperless only; not exposed externally
  redis:
    controller: redis
    ports:
      redis:
        enabled: true
        port: 6379
        protocol: TCP
        primary: true

persistence:
  # Scanned/consumed documents and thumbnails
  media:
    enabled: true
    retain: true
    accessMode: ReadWriteOnce
    size: 20Gi
    globalMounts:
      - path: /usr/src/paperless/media
  # SQLite-less app state: index, search index, config
  data:
    enabled: true
    retain: true
    accessMode: ReadWriteOnce
    size: 5Gi
    globalMounts:
      - path: /usr/src/paperless/data
  # Export target for document_exporter
  export:
    enabled: true
    retain: true
    accessMode: ReadWriteOnce
    size: 10Gi
    globalMounts:
      - path: /usr/src/paperless/export

ingress:
  # Disabled by default — enable and set a real host, e.g. via Argo valuesObject:
  # ingress:
  #   main:
  #     enabled: true
  #     className: traefik
  #     annotations:
  #       traefik.ingress.kubernetes.io/router.tls: "true"
  #     hosts:
  #       - host: paperless.chart.example
  #         paths:
  #           - path: /
  #             pathType: Prefix
  #             service:
  #               identifier: main
  #               port: 8000
  #     tls:
  #       - hosts:
  #           - paperless.chart.example
  main:
    enabled: false
    hosts:
      - host: paperless.chart.example
        paths:
          - path: /
            pathType: Prefix
            service:
              identifier: main
              port: 8000
